version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: course-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CourseApi
    ports:
      - "5433:5432"  # пробрасываем на другой порт, чтобы не конфликтовать с локальной БД
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - course-network
    restart: unless-stopped

  api:
    image: course-api:v1
    container_name: course-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DbConnection=Host=postgres;Port=5432;Database=CourseApi;Username=postgres;Password=postgres 
    networks:
      - course-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  course-network:
    driver: bridge